name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BeatPad.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BeatPad-apk
          path: BeatPad.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: BeatPad (latest build)
          body: Download BeatPad.apk below and install it on your phone.
          files: BeatPad.apk
          prerelease: false
